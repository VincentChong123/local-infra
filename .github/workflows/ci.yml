name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        uses: wagoid/commitlint-github-action@v6

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      langfuse: ${{ steps.filter.outputs.langfuse || steps.act-fallback.outputs.enabled }}
      hyperdx: ${{ steps.filter.outputs.hyperdx || steps.act-fallback.outputs.enabled }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable all targets when running under local act
        if: ${{ env.ACT }}
        id: act-fallback
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        if: ${{ !env.ACT }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            langfuse:
              - 'langfuse/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            hyperdx:
              - 'hyperdx/**'
              - 'grafana/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  test-langfuse-stack:
    name: Langfuse Stack Smoke Test
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.langfuse == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment file
        run: |
          EXISTING_DIR="$(docker inspect langfuse-postgres-1 --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' 2>/dev/null || true)"
          if [ -n "$EXISTING_DIR" ] && [ -f "$EXISTING_DIR/.env" ]; then
            cp "$EXISTING_DIR/.env" langfuse/.env
          elif [ ! -f langfuse/.env ]; then
            cp langfuse/.env.example langfuse/.env
            sed -i "s/CHANGEME_32_HEX_CHARS/$(openssl rand -hex 16)/g" langfuse/.env
            sed -i "s/CHANGEME_64_HEX_CHARS/$(openssl rand -hex 32)/g" langfuse/.env
          fi

      - name: Start Langfuse Stack
        working-directory: langfuse
        run: |
          bash scripts/run_langfuse.sh

      - name: Run Langfuse Smoke Tests
        working-directory: langfuse
        run: |
          bash scripts/test_langfuse.sh

      - name: Dump container logs on failure
        if: failure()
        working-directory: langfuse
        run: |
          docker compose logs --tail=100

      - name: Teardown Stack
        if: ${{ always() && !env.ACT }}
        working-directory: langfuse
        run: |
          docker compose down -v

  test-hyperdx-stack:
    name: HyperDX Stack Smoke Test
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.hyperdx == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment files
        run: |
          [ -f hyperdx/.env ] || cp hyperdx/.env.example hyperdx/.env
          [ -f grafana/.env ] || cp grafana/.env.example grafana/.env
          mkdir -p grafana/data
          if [ "${ACT:-}" != "true" ]; then
            sudo chown -R 1000:1000 grafana/data
          fi

      - name: Start HyperDX + Grafana Stack
        working-directory: hyperdx
        run: |
          bash scripts/run_hyperdx.sh

      - name: Run HyperDX + Grafana Smoke Tests
        working-directory: hyperdx
        run: |
          bash scripts/test_hyperdx.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f hyperdx/docker-compose.yaml logs --tail=100
          docker compose -f grafana/docker-compose.yaml logs --tail=100

      - name: Teardown Stack
        if: ${{ always() && !env.ACT }}
        run: |
          docker compose -f grafana/docker-compose.yaml down -v
          docker compose -f hyperdx/docker-compose.yaml down -v
