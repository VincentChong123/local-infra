name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        uses: wagoid/commitlint-github-action@v6

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      langfuse: ${{ steps.filter.outputs.langfuse }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Langfuse changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            langfuse:
              - 'langfuse/**'
              - '.github/workflows/ci.yml'

  test-langfuse-stack:
    name: Langfuse Stack Smoke Test
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.langfuse == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment file
        run: |
          cp langfuse/.env.example langfuse/.env
          # Replace placeholder secrets with valid hex strings
          sed -i "s/CHANGEME_32_HEX_CHARS/$(openssl rand -hex 16)/g" langfuse/.env
          sed -i "s/CHANGEME_64_HEX_CHARS/$(openssl rand -hex 32)/g" langfuse/.env

      - name: Start Langfuse Stack
        working-directory: langfuse
        run: |
          bash scripts/run_langfuse.sh

      - name: Run Langfuse Smoke Tests
        working-directory: langfuse
        run: |
          bash scripts/test_langfuse.sh

      - name: Dump container logs on failure
        if: failure()
        working-directory: langfuse
        run: |
          docker compose logs --tail=100

      - name: Teardown Stack
        if: always()
        working-directory: langfuse
        run: |
          docker compose down -v
