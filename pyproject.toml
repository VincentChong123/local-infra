[project]
name = "local-infra"
version = "0.1.0"
description = "Local developer infrastructure and Antigravity telemetry tools"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "python-dotenv>=1.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/test*.py" = ["S101"]
"**/tests/test*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["langfuse/scripts"]
exclude = [".venv", "**/__pycache__"]
reportMissingImports = "none"
